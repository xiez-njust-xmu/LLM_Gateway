# Grafana 数据源：指向本地 Prometheus
# uid 固定为 prometheus，供 dashboards/*.json 里的 datasource.uid 引用。
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
      httpMethod: POST